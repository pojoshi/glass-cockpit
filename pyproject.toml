[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glass-cockpit"
version = "0.1.0"
description = "Operator cockpit for a fleet of autonomous agents: live status, an approval queue, per-agent kill switches, and reasoning replay, built on countersigned-actions for policy and audit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "countersigned-actions @ git+https://github.com/pojoshi/countersigned-actions.git",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
glass-cockpit = "glasscockpit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glasscockpit = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
